services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alimentaves
      POSTGRES_USER: alimentaves
      POSTGRES_PASSWORD: alimentaves_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alimentaves -d alimentaves"]
      interval: 5s
      timeout: 5s
      retries: 12

  back:
    build: ./back
    environment:
      DATABASE_URL: postgresql://alimentaves:alimentaves_local_dev@db:5432/alimentaves
      ALIMENTAVES_TEST_DATABASE_URL: postgresql://alimentaves:alimentaves_local_dev@db:5432/alimentaves_test
      MEDIA_STORAGE_PATH: /data/media
      DEMO_SEED: "1"
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./back:/app
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  front:
    build: ./front
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./front:/app
      - alimentaves_node_modules:/app/node_modules
    depends_on:
      back:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  media_data:
  alimentaves_node_modules:
